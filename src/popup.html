<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 380px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      margin: 0;
      color: #222;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Username ── */
    .username-section {
      margin-bottom: 10px;
    }
    .username-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .username-row input {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }
    .username-row button {
      padding: 5px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f8f8f8;
      cursor: pointer;
      font-size: 12px;
    }
    .username-row button:hover { background: #e8e8e8; }
    .username-saved {
      color: #4caf50;
      font-size: 11px;
      margin-top: 2px;
      min-height: 14px;
    }

    /* ── Update banner ── */
    .update-banner {
      border: 1px solid #f2c94c;
      border-radius: 6px;
      background: #fff8db;
      color: #5d4500;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 12px;
      line-height: 1.35;
    }
    .update-banner-title {
      font-weight: 600;
      margin-bottom: 3px;
    }
    .update-banner-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .update-banner button {
      padding: 4px 8px;
      border: 1px solid #d0a900;
      border-radius: 4px;
      background: #fff;
      color: #5d4500;
      cursor: pointer;
      font-size: 12px;
    }
    .update-banner button:hover { background: #fff3b0; }

    /* ── Status panel ── */
    .status-panel {
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .status-row:last-child { margin-bottom: 0; }
    .status-label {
      font-size: 12px;
      color: #666;
      min-width: 70px;
    }
    .status-value {
      font-size: 12px;
      font-weight: 500;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #bbb;
      flex-shrink: 0;
    }
    .dot.green { background: #4caf50; box-shadow: 0 0 4px rgba(76,175,80,0.5); }
    .dot.orange { background: #ff9800; }
    .room-id {
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 11px;
      color: #555;
    }

    /* ── Not on playtest ── */
    .not-playtest {
      text-align: center;
      padding: 20px 10px;
      color: #888;
      font-size: 13px;
    }

    /* ── Log ── */
    .section { margin-bottom: 10px; }
    .section-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
      display: block;
    }
    #log {
      height: 220px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 6px;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 11px;
      background: #fafafa;
    }
    #log div { margin-bottom: 2px; word-break: break-word; }
    .log-in { color: #1976d2; }
    .log-out { color: #388e3c; }

    /* ── Settings sections ── */
    .settings-section {
      margin-bottom: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 8px 12px;
      background: #f5f5f5;
    }
    .settings-heading {
      font-size: 12px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }
    .settings-toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .settings-toggle-row:last-child { margin-bottom: 0; }
    .settings-toggle-label {
      font-size: 12px;
      color: #999;
      transition: color 0.15s;
    }
    .settings-toggle-row.on .settings-toggle-label {
      color: #333;
    }
    .settings-toggle-track {
      position: relative;
      width: 34px;
      height: 18px;
      border: none;
      border-radius: 9px;
      background: #ccc;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .settings-toggle-row.on .settings-toggle-track {
      background: #4caf50;
    }
    .settings-toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: left 0.2s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .settings-toggle-row.on .settings-toggle-thumb {
      left: 18px;
    }

    /* ── Log toggle ── */
    .log-toggle {
      display: block;
      width: 100%;
      padding: 0;
      border: none;
      background: none;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      text-align: left;
      margin-bottom: 4px;
    }
    .log-toggle:hover { color: #333; }
  </style>
</head>
<body>
  <h1>MoxMox</h1>

  <div id="content">
    <!-- Populated by popup.js -->
  </div>

  <script src="popup.js"></script>
</body>
</html>
